<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173a55"><title>社会科 NEWS | 授業につながるニュース</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;color:#193044;background:#f3f6f9}*{box-sizing:border-box}body{margin:0}header{background:#173a55;color:white;padding:24px max(18px,calc((100vw - 1100px)/2))}header h1{margin:0;font-size:27px}header p{opacity:.85;margin:7px 0 0}.wrap{max-width:1100px;margin:24px auto;padding:0 18px}.tools{background:white;border:1px solid #dce5ed;border-radius:16px;padding:18px;display:grid;gap:12px}.filters{display:flex;flex-wrap:wrap;gap:8px}button,select,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #c8d6e1;border-radius:10px;padding:9px 13px;background:white;color:#173a55}button.active,.primary{background:#173a55;color:white;border-color:#173a55}input,select,textarea{border:1px solid #c8d6e1;border-radius:9px;padding:10px;width:100%;background:white}.search{display:grid;grid-template-columns:1fr 180px;gap:10px}.meta{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:20px 0;color:#536878;font-size:13px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}.card{background:white;border:1px solid #dce5ed;border-radius:15px;padding:18px;display:flex;flex-direction:column;gap:10px}.card h2{font-size:18px;line-height:1.5;margin:0}.card p{font-size:14px;line-height:1.7;margin:0;color:#45596a}.tag{font-size:12px;background:#e7f0f7;color:#204969;padding:5px 8px;border-radius:6px}.tags{display:flex;gap:6px;flex-wrap:wrap}.question{background:#f0f5f9;border-radius:9px;padding:11px;font-size:14px;line-height:1.6}.card footer{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}.card a{background:#173a55;color:white;border-radius:9px;text-decoration:none;padding:9px 12px;font-size:14px}.muted{color:#607383;font-size:12px}.empty{padding:30px;text-align:center;background:white;border-radius:12px}.notice{font-size:13px;color:#4d6170;line-height:1.7}.small{font-size:12px}.card textarea{min-height:72px;resize:vertical}.card details summary{cursor:pointer;color:#173a55;font-size:13px}.toprow{display:flex;justify-content:space-between;gap:10px;align-items:center}@media(max-width:600px){.search{grid-template-columns:1fr}header h1{font-size:24px}}
</style></head><body><header><h1>📚 社会科 NEWS</h1><p>今日のニュースを、明日の授業へ。中学校社会科の教材研究ダッシュボード</p></header><main class="wrap"><section class="tools"><div class="filters" id="categories"></div><div class="search"><input id="search" placeholder="ニュース・キーワード・単元を検索"><select id="grade"><option value="all">すべての学年</option><option value="中1">中1</option><option value="中2">中2</option><option value="中3">中3</option></select></div><div class="filters"><button id="savedOnly">☆ 保存した記事</button><button id="regional">岩手・東北を優先</button><button id="reset">条件をリセット</button></div></section><div class="meta"><span id="status">ニュースを読み込み中…</span><span id="count"></span></div><section id="cards" class="cards" aria-live="polite"></section><p class="notice">※ 見出しは各配信元の公開RSSから取得します。本文は元記事で確認してください。授業での問い・関連単元はキーワードによる自動提案のため、教師による確認が必要です。保存・メモはこの端末のブラウザ内に保存されます。</p></main><script>
const rules=[{re:/選挙|国会|内閣|憲法|法律|裁判|政治|首相|議会|投票/,cat:'公民',unit:'民主政治・国民主権',grade:'中3',q:'このニュースは、私たちの政治参加とどう関係するだろう？'},{re:/物価|円安|円高|賃金|経済|貿易|関税|企業|税|金融|予算/,cat:'公民',unit:'経済と私たちの生活',grade:'中3',q:'この変化は、消費者や企業にどんな影響を与えるだろう？'},{re:/地震|津波|台風|豪雨|気候|気温|災害|火山|防災/,cat:'地理',unit:'日本の自然環境と防災',grade:'中2',q:'この地域の自然条件と被害・対策にはどんな関係があるだろう？'},{re:/人口|過疎|少子|高齢|移住|地域|鉄道|交通|観光|農業|工業|漁業|米|水産/,cat:'地理',unit:'日本の諸地域・人口と産業',grade:'中2',q:'地域の特色は、人々の暮らしや産業にどう影響しているだろう？'},{re:/岩手|盛岡|北上|花巻|奥州|釜石|宮古|一関|東北/,cat:'地理',unit:'身近な地域の調査・東北地方',grade:'中2',q:'この出来事は、岩手・東北の地域的特色とどうつながるだろう？'},{re:/遺跡|文化財|世界遺産|歴史|江戸|明治|戦争|古墳|城|史跡|博物館/,cat:'歴史',unit:'歴史の資料と現代社会',grade:'中2',q:'この出来事を歴史的な背景から考えると何が見えるだろう？'},{re:/国際|国連|外交|紛争|平和|難民|条約|世界/,cat:'公民',unit:'国際社会と平和',grade:'中3',q:'国際社会が協力して解決するには何が必要だろう？'}];
const categories=['すべて','地理','歴史','公民','未分類'];let current='すべて',items=[],savedOnly=false,regional=false;const $=id=>document.getElementById(id),storeKey='shakai-news-v1';let stored={};try{stored=JSON.parse(localStorage.getItem(storeKey)||'{}')}catch{}const save=()=>localStorage.setItem(storeKey,JSON.stringify(stored));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function classify(x){const s=x.title+' '+(x.description||'');const rule=rules.find(r=>r.re.test(s));return rule?{cat:rule.cat,unit:rule.unit,grade:rule.grade,q:rule.q}:{cat:'未分類',unit:'ニュースを読み解く',grade:'中1',q:'このニュースで、社会科の学習と関係することは何だろう？'}}function draw(){let q=$('search').value.trim().toLowerCase(),grade=$('grade').value;let a=items.filter(x=>{let r=classify(x);return(current==='すべて'||r.cat===current)&&(grade==='all'||r.grade===grade)&&(!savedOnly||stored[x.id]?.star)&&(!q||(x.title+' '+x.description+' '+r.unit+' '+x.source).toLowerCase().includes(q))});if(regional)a.sort((x,y)=>Number(/岩手|盛岡|北上|東北|花巻|釜石/.test(y.title))-Number(/岩手|盛岡|北上|東北|花巻|釜石/.test(x.title)));$('count').textContent=a.length+' 件';$('cards').innerHTML=a.length?a.map(x=>{let r=classify(x),state=stored[x.id]||{};return `<article class="card"><div class="toprow"><span class="tag">${esc(r.cat)}｜${esc(r.grade)}</span><span class="muted">${esc(x.date||'日付不明')}</span></div><h2>${esc(x.title)}</h2><div class="muted">${esc(x.source||'配信元不明')}</div><div class="tags"><span class="tag">${esc(r.unit)}</span></div><div class="question"><strong>💡 授業での問い</strong><div>${esc(r.q)}</div></div><details><summary>授業メモを記入</summary><textarea data-note="${esc(x.id)}" placeholder="導入で使う資料、発問、教科書のページなど">${esc(state.note||'')}</textarea></details><footer><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">元記事を読む ↗</a><button data-star="${esc(x.id)}">${state.star?'★ 保存済み':'☆ 保存'}</button></footer></article>`}).join(''):'<div class="empty">条件に合う記事がありません。検索条件を変更してください。</div>';document.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{let id=b.dataset.star;stored[id]={...stored[id],star:!stored[id]?.star};save();draw()});document.querySelectorAll('[data-note]').forEach(t=>t.oninput=()=>{let id=t.dataset.note;stored[id]={...stored[id],note:t.value};save()});document.querySelectorAll('#categories button').forEach(b=>b.classList.toggle('active',b.textContent===current));$('savedOnly').classList.toggle('active',savedOnly);$('regional').classList.toggle('active',regional)}$('categories').innerHTML=categories.map(c=>`<button>${c}</button>`).join('');document.querySelectorAll('#categories button').forEach(b=>b.onclick=()=>{current=b.textContent;draw()});$('search').oninput=draw;$('grade').onchange=draw;$('savedOnly').onclick=()=>{savedOnly=!savedOnly;draw()};$('regional').onclick=()=>{regional=!regional;draw()};$('reset').onclick=()=>{current='すべて';savedOnly=false;regional=false;$('search').value='';$('grade').value='all';draw()};fetch('./news.json?cache='+Date.now()).then(r=>{if(!r.ok)throw Error('not found');return r.json()}).then(data=>{items=(data.items||[]).filter(x=>/^https?:\/\//.test(x.url));$('status').textContent=`最終更新：${data.updated||'不明'} ｜ 記事の更新は公開サイトで自動実行`;draw()}).catch(()=>{$('status').textContent='ニュース未取得：READMEの公開・更新設定を行ってください';items=[];draw()});
</script></body></html>
